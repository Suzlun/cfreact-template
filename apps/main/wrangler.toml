name = "cfreact-template-server"
main = "src/backend/entry/index.ts"
tsconfig = "tsconfig.backend.json"
compatibility_date = "2025-11-13"
compatibility_flags = ["nodejs_compat"]

[secrets]
required = ["CORE_API_TOKEN"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[[services]]
binding = "CORE_API"
service = "cfreact-template-core"

[[kv_namespaces]]
binding = "KV"
id = "YOUR_KV_NAMESPACE_ID_HERE"

[[r2_buckets]]
binding = "R2"
bucket_name = "cfreact-template-bucket"

[env.production]
name = "cfreact-template-server-production"

[env.production.secrets]
required = ["CORE_API_TOKEN"]

[env.production.assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/health"]

[[env.production.services]]
binding = "CORE_API"
service = "cfreact-template-core-production"

[[env.production.kv_namespaces]]
binding = "KV"
id = "YOUR_PRODUCTION_KV_NAMESPACE_ID_HERE"

[[env.production.r2_buckets]]
binding = "R2"
bucket_name = "cfreact-template-bucket-production"
