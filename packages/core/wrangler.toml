name = "cfreact-template-core"
main = "src/entry/index.ts"
tsconfig = "tsconfig.json"
compatibility_date = "2025-11-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "cfreact-template-db"
database_id = "YOUR_DATABASE_ID_HERE"
migrations_dir = "drizzle/migrations"

[[send_email]]
name = "EMAIL"

[vars]
EMAIL_FROM = "noreply@example.com"
EMAIL_TO = "recipient@example.com"

[env.production]
name = "cfreact-template-core-production"
workers_dev = false
preview_urls = false

[env.production.vars]
EMAIL_FROM = "noreply@example.com"
EMAIL_TO = "recipient@example.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "cfreact-template-db-production"
database_id = "YOUR_PRODUCTION_DATABASE_ID_HERE"
migrations_dir = "drizzle/migrations"

[[env.production.send_email]]
name = "EMAIL"
