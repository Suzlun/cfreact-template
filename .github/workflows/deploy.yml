name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Deployする既存のvX.Y.Zタグ
        required: true
        type: string
      targets:
        description: 配備対象
        required: true
        default: all
        type: choice
        options:
          - all
          - core
          - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy To Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_TOKEN_app_terraform_io: ${{ secrets.HCP_TERRAFORM_TOKEN }}
      TERRAFORM_BACKEND_CONFIG: ${{ secrets.TERRAFORM_BACKEND_CONFIG }}
      WORKER_SECRETS_FILE: ${{ runner.temp }}/worker-secrets.json
      WRANGLER_ENVIRONMENT: ${{ vars.WRANGLER_ENVIRONMENT || 'production' }}
    steps:
      - name: Detect Cloudflare credentials
        id: credentials
        env:
          CORE_API_TOKEN: ${{ secrets.CORE_API_TOKEN }}
        run: |
          # リリースとdeployを独立させ、credentials未設定の生成先では安全にdeployだけを省略します。
          if [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] && [ -n "${CORE_API_TOKEN}" ] && [ -n "${TF_TOKEN_app_terraform_io}" ] && [ -n "${TERRAFORM_BACKEND_CONFIG}" ]; then
            printf '%s\n' 'configured=true' >> "${GITHUB_OUTPUT}"
          else
            printf '%s\n' 'configured=false' >> "${GITHUB_OUTPUT}"
            printf '%s\n' 'Deploy skipped: configure Cloudflare, core API, and HCP Terraform credentials in the production environment.'
          fi

      - name: Checkout release tag
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Release Workflowが明示した既存tagをcheckoutし、GITHUB_TOKENのevent抑止へ依存しません。
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Setup Node
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup pnpm
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        run: |
          # release commitのpackage managerを再現し、tagごとのbuild結果を安定させます。
          corepack enable
          corepack prepare pnpm@11.16.0 --activate

      - name: Setup Terraform
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.16.0

      - name: Install dependencies
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Validate release tag
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        env:
          DEPLOY_TAG: ${{ inputs.tag }}
        run: |
          # 保護されたmainへ取り込まれ、tag名、全manifest、CHANGELOGが一致するcommitだけをdeployします。
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            printf '%s\n' "${DEPLOY_TAG} does not point to a commit contained in main." >&2
            exit 1
          fi
          expected_tag=$(node -p "'v' + JSON.parse(require('node:fs').readFileSync('.release/plan.json', 'utf8')).version")
          if [ "${DEPLOY_TAG}" != "${expected_tag}" ]; then
            printf '%s\n' "Tag mismatch: expected ${expected_tag}, received ${DEPLOY_TAG}." >&2
            exit 1
          fi
          node scripts/release/validate-release.mjs

      - name: Build
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        run: pnpm build

      - name: Read Terraform outputs
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        run: |
          # 長期資源はTerraformだけが所有し、配備処理は確定済みstateを読み取ります。
          mkdir -p .wrangler
          printf '%s' "${TERRAFORM_BACKEND_CONFIG}" > .wrangler/production.tfbackend
          terraform -chdir=infra/terraform/production init -backend-config="${GITHUB_WORKSPACE}/.wrangler/production.tfbackend"
          terraform -chdir=infra/terraform/production output -json > .wrangler/terraform-outputs.json

      - name: Render Wrangler configurations
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        run: pnpm release:render-wrangler -- --terraform-outputs .wrangler/terraform-outputs.json

      - name: Apply core database migrations
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        run: |
          # migration台帳を持つWrangler D1 migrationsで未適用分だけをcore配備前に適用します。
          pnpm --filter @cfreact-template/core exec wrangler d1 migrations apply DB --config "${GITHUB_WORKSPACE}/packages/core/wrangler.release.toml" --env "${WRANGLER_ENVIRONMENT}" --remote

      - name: Prepare Worker secrets
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        env:
          CORE_API_TOKEN: ${{ secrets.CORE_API_TOKEN }}
        run: |
          # 一時ファイルだけをWranglerへ渡し、トークンを引数、ログ、リポジトリへ残しません。
          umask 077
          node -e "require('node:fs').writeFileSync(process.env.WORKER_SECRETS_FILE, JSON.stringify({ CORE_API_TOKEN: process.env.CORE_API_TOKEN }))"

      - name: Deploy selected targets
        if: ${{ steps.credentials.outputs.configured == 'true' }}
        env:
          DEPLOY_TARGETS: ${{ inputs.targets }}
        run: |
          # coreを依存appより先に配備し、台帳外の入力を受理しません。
          pnpm release:deploy-targets -- --targets "${DEPLOY_TARGETS}" --environment "${WRANGLER_ENVIRONMENT}" --secrets-file "${WORKER_SECRETS_FILE}"

      - name: Remove Worker secrets file
        if: ${{ always() && steps.credentials.outputs.configured == 'true' }}
        run: rm -f "${WORKER_SECRETS_FILE}"
