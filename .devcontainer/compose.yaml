services:
  dependencies:
    build:
      context: .
      dockerfile: Dockerfile.storybook
    working_dir: /workspaces/project
    command: pnpm install --frozen-lockfile
    environment:
      CI: 'true'
    volumes:
      - ..:/workspaces/project

  dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    depends_on:
      dependencies:
        condition: service_completed_successfully
    volumes:
      - ..:/workspaces/project
      - ./.volumes/dev-config:/home/node/.config
      - ./.volumes/opencode-config:/home/node/.config/opencode
      - ./.volumes/opencode-data:/home/node/.local/share/opencode
      - ./.volumes/opencode-state:/home/node/.local/state/opencode

  storybook:
    build:
      context: .
      dockerfile: Dockerfile.storybook
    restart: unless-stopped
    init: true
    working_dir: /workspaces/project
    command: node scripts/storybook/host.mjs --host 0.0.0.0
    depends_on:
      dependencies:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${STORYBOOK_HOST_PORT:-0}:7456'
    volumes:
      - ..:/workspaces/project
    tmpfs:
      - /workspaces/project/.devcontainer/.volumes:mode=0700,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'fetch("http://127.0.0.1:7456/health").then(r => { if (!r.ok) process.exit(1); })',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
