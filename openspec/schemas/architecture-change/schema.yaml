name: architecture-change
version: 6
description: 所有者確認済みの要求から、重要な構造変更を提案、必要な仕様、設計、作業パッケージの順で管理する

artifacts:
  - id: request
    generates: request.md
    description: OpenCodeが所有者確認済みの内容を随時反映する要求
    template: request.md
    instruction: |
      OpenCodeのプライマリエージェントが所有者との対話、request.md、統合モックと計画の委任を担当する。公式スキルと入口コマンドは汎用的な進行手順であり、委任先の計画成果物は担当者が作成する。
      OpenCodeは公開アプリごとの統合Reactモックを`mockups/<app>/src/`で作成します。`App.tsx`が操作の流れを持ち、`App.stories.tsx`の引数で初期画面と状態を選びます。共通UIの公開サブパス、固定データ、ローカル状態を使います。製品要件の根拠は所有者確認済みの要求に置く。
      標準の実行環境はDev Containerです。`pnpm storybook:host`がプロジェクト選択と開発プレビューを提供し、`pnpm storybook:mockup`はモック用Storybookを直接起動します。`pnpm build:mockup`でGit管理対象外の`mockups/dist`へビルドします。共通の`mockups/.storybook`と`mockups/tsconfig.json`は、共通UIのTailwind CSS 4とReact Compiler設定を再利用します。
      表示例の引数で初期画面と状態を選び、Reactモック内で操作の流れを確認する。共有UIや要求の変更時は影響するモックを再確認する。モックは変更のアーカイブ後も保持し、編集規則はmockups/AGENTS.mdに従う。
      `request.md`は確認済み内容を随時更新する要求の集合とし、保存する各項目が所有者確認済みであることを守る。
      具体的な解決手段より先に、利用者、現在の状況、変更動機、期待価値、希望成果を確認する。成果や範囲を左右する未確認事項だけを質問する。
      変更動機には、困りごとや制約などの否定的な要因だけでなく、期待、機会、好奇心、未探索の可能性などの肯定的な要因も含める。
      所有者が確認した背景、変更動機と期待価値、要求、明示した成果制約、明示的に必須とした手段だけを記載する。
      背景と変更動機は要求の理由を示す証拠として扱い、製品要件と成果制約は所有者が求めた成果から導く。
      解決手段を示す入力では、その手段が必要となる背景、変更動機、希望成果を先に確認し、所有者が明示的に拘束した場合だけ必須手段として記載する。
      成果制約または必須手段がない場合は、対応する任意の節を作成しない。
      関連する`UIモック参照`にはmockups/main/src/App.stories.tsx#Homeやmockups/main/src/App.stories.tsx#UsersErrorのような参照を記載する。SHAPEでは実際に採用された表示例を特定する。参照は設計の証拠であり、製品の目的と成果は所有者確認済みの要求を根拠にする。
      `Request-Status: CONFIRMED`を使用し、`所有者の確認`に保存した内容と所有者の明示発言との対応を記録する。
      所有者の明確な明示発言は、初回作成でも更新でも確認証拠として十分である。その内容を即時反映し、同じ内容の再承認を求めない。
      発言の意味または拘束力が不明な場合だけ、OpenCodeが一つの焦点に絞って確認してから保存する。
      `SHAPE`では要求と承認済みモックを双方向に照合し、モックが確認済み成果と制約を満たすこと、およびモックに含まれる製品の意味が要求に根拠を持つことを確認する。
      重要なUX判断の理由または所有者確認が不足する場合は対話で補い、確認済みの目的、成果、成果制約は要求へ、設計の詳細は設計成果物へ反映する。
      観点を変更したら参照する各変更の要求と判断理由を追跡し、影響する計画成果物を整合させる。利用者の体験に影響する要求を更新した場合も、関連する観点を見直す。
    requires: []

  - id: proposal
    generates: proposal.md
    description: 所有者確認済みの要求を実現する変更提案
    template: proposal.md
    instruction: |
      `openspec/planner`がproposal.mdと該当する`.openspec.yaml`の`skip_specs`設定を作成・更新する。製品の意味が不足する場合はプライマリエージェントを通じて所有者へ確認する。
      `Request-Status: CONFIRMED`のrequest.mdを読み、`behavior-change`と同じ提案契約で記載された要求の範囲だけを提案する。
      request.mdが存在しない、確認済みでない、または意味が不明な場合は成果物を作成せず、OpenCodeが所有者へ確認する。
      成果物の意味に関わる内容が確認済み要求または権威ある証拠から自明でない場合は、OpenCodeが所有者へ一つの焦点に絞って確認する。
      構造変更は成果を実現する手段として扱い、所有者が明示的に必須とした場合は設計制約として記録する。
      要求が観測可能な振る舞いを変更しない場合は`.openspec.yaml`へ`skip_specs: true`を設定し、`Spec Units`へ理由付きの「なし」を記載して差分仕様を作成しない。
      要求が観測可能な振る舞いも変更する場合は`skip_specs`を設定せず、確認済み要求から直接導ける差分仕様領域だけを記載する。
      `design.md`の確定前に、`openspec/architect`が存在する各差分仕様単位をパッケージで代替可能な汎用能力へ分解し、利用できる既存コード、ワークスペース内のパッケージ、対象パッケージの直接依存、他のパッケージで採用済みの依存、推移依存、新規外部候補、更新候補について必要な調査と再利用判断を行う。
      再利用判断に使う調査報告は、対象の汎用能力を`調査範囲`へ明記した現在の一次資料付き報告に限る。Requirement対応表または別能力の候補調査を、外部候補調査の証拠へ流用しない。
      リポジトリの事実、一般的な慣行、セキュリティ上の推奨、実装上の必要性から新しい成果または成果制約を追加しない。
      `UX-Mode` は `NONE`、`CONTINUITY`、`SHAPE` のいずれかとし、条件に応じた UI / UX Impact を記載する。
      `NONE`ではモックを必要としない。`CONTINUITY`では維持する既存の製品体験を特定し、参照して内容を確認できる実装済み製品の証拠を`Continuity Source`に記録する。
      `SHAPE`のproposal.mdは、所有者が対象の方向性を採用し、確認済み成果と承認済みモックの重要な内容が双方向に整合してから作成する。
      `SHAPE`では`UI / UX Impact`内に、中心作業を`Primary User Task`、採用した体験の方向性と重要な判断の理由を`UX Direction`、承認済みモックの参照を`Design Source`として記録する。
      `Design Source`には、要求の`UIモック参照`と同じ、対象アプリをパスで識別できる採用済み画面・状態の正確な参照、関連する画面・操作の流れ・状態の範囲、その範囲を所有者が採用した短い証跡を記載する。承認の証拠はこの既存の節で扱い、設計の詳細は`mockups/<app>/src/**`と参照先のStorybook表示例で確認する。
      重要なUX判断の理由または所有者確認が不足する場合はOpenCodeが所有者へ確認し、内容の意味に応じて要求または設計へ反映してから提案を作成する。
      `Confirmed Change Boundary`は実現する肯定的な成果と外部契約の境界だけを記載する。
      実装手順、ファイル一覧、試験階層別計画は記載しない。
    requires:
      - request

  - id: specs
    generates: 'specs/*/spec.md'
    description: 観測可能な振る舞いも変える場合に、構造変更後の結果を定める差分仕様
    template: spec.md
    instruction: |
      `openspec/planner`が差分仕様を作成・更新し、主仕様の同期も依頼された場合に担当する。アーカイブの進行はプライマリエージェントが担当する。
      `.openspec.yaml`に`skip_specs: true`がある場合は成果物を作成しない。
      それ以外の場合はrequest.md、proposal.md、該当する承認済み設計を読み、確認済み要求から直接導ける各仕様領域に `specs/<capability>/spec.md` を作成する。`SHAPE`では`Design Source`の承認済みモックを確認する。
      製品の意味を認める根拠はrequest.mdだけとし、承認済み設計は要求を実現する具体像として照合する。不整合はプライマリエージェントへ返し、要求の意味は所有者との対話で、提案・仕様・作業範囲の不備は計画担当者が、設計の不備は設計担当者が解決する。
      冒頭の `## Purpose` に、所有者確認済みの要求が求める永続的仕様領域の目的を肯定形で記載する。
      要件とシナリオには、所有者が確認した利用者または外部契約から観測できる肯定的な終端状態だけを記載する。
      必須手段と設計の詳細は設計成果物で扱う。所有者が求める体験そのものを表す可視のUI構成または配置は、要求で確認済みの成果制約として記載できる。
      削除する既存要件は`REMOVED Requirements`で除去する。
      認可や秘密非開示など拒否自体が確認済み成果に含まれる場合も、認可された主体や公開可能な情報を表す肯定的な保証として定義し、その保証を観測する拒否シナリオを記載できる。
      シナリオ見出しは `#### Scenario: <名称> (<CAPABILITY>-S###)` とする。
    requires:
      - request
      - proposal

  - id: design
    generates: design.md
    description: 確認済み要求と存在する差分仕様を満たすために必要な重要な設計判断
    template: design.md
    instruction: |
      `openspec/architect`が`DESIGN`の割り当てでフロントエンドとバックエンドを統合し、design.mdだけを作成・更新する。不可欠な調査だけを`researcher`へ委任する。製品の意味や他の計画成果物の不備はプライマリエージェントへ返し、`openspec/planner`とは互いを呼び出さない。
      確認済みRequest、proposal.md、存在する差分仕様を実現するために必要な物質的判断だけを記載する。
      `SHAPE`では`Design Source`で特定された承認済み設計とモックも読み、採用済みのUX判断と実装上の設計判断を整合させる。重要なUX判断の理由や所有者確認が不足する場合はOpenCodeで確認し、設計の詳細は設計成果物へ記録する。
      第2階層の見出しは、指定順でMaterial Decisions、Reuse Assessment、Boundaries、Data、Security、Migration、Rollback、Failure Modes、Risks、Verification、Revisit Triggersとする。各節内で必要な図は第3階層の見出しで識別する。
      構造・関係・順序・状態の図示が重要な設計上の誤解を減らせる場合だけ、対応する既存の節にGitHub対応のMermaid図を`mermaid`コードブロックで記載する。文章や表で十分な場合は図が0枚でもよく、枚数や種類を固定しない。作成しない図の欄や省略理由は残さない。
      テンプレートの各図にある採用条件・描く対象・Mermaidコードを使い、必要な雛形だけを具体化する。役割名・処理名・関係・条件を採用した設計の具体名と内容へ置換し、登場要素と矢印も対象に合わせる。使わない図は第3階層見出し・説明・コードブロックごと削除し、完成した設計に未置換の雛形や記入用コメントを残さない。
      担当間の順序や副作用は`sequenceDiagram`、状態と遷移条件は`stateDiagram-v2`、重要な概念の関係・多重度・所有権は`classDiagram`で表す。責務・依存方向・実行場所・信頼境界には`flowchart`を使える。構成図は厳密なUML記法を要求せず、各種図を揃えるためには作成しない。
      一つの図は一つの主要な論点と、その理解に必要な変更箇所・周辺だけを描く。要素と分岐は確認済み要求と採用した設計に基づけ、クラス図をコード要素の一覧や詳細な実装計画にしない。図のラベルは日本語とし、正確な綴りが必要な識別子はそのまま使う。
      図は構造・関係・順序・状態を、文章や表は採用理由・制約・図だけで表せない条件を示し、同じ内容を重複させない。図と本文の矛盾は設計の不整合として解消する。
      Reuse Assessmentには存在する全delta Spec Unitを少なくとも一行ずつ記載し、各Spec Unitをパッケージで代替可能な汎用能力へ分解する。同じSpec Unitに複数能力がある場合は行を分ける。`skip_specs: true`の場合はSpec Unitや調査行を作らず、該当しない理由を記載する。
      各行はSpec Unit、Reusable Capability、Source Classification、Decision、Selected Reuse / Version、Research Evidence、Limited Complement Justificationを持つ。
      Source Classificationは`REPOSITORY_CODE`、`WORKSPACE_PACKAGE`、`DIRECT_DEPENDENCY`、`REPOSITORY_DEPENDENCY`、`TRANSITIVE_ONLY`、`NEW_EXTERNAL`、`EXISTING_UPDATE`、`NO_REUSABLE_CANDIDATE`のいずれかとする。
      Decisionは`REUSE`、`ADOPT`、`UPDATE`、`REPLACE`、`LIMITED_COMPLEMENT`のいずれかとする。推移依存は直接採用済みと扱わず、利用するpackageが正規の直接依存として宣言する判断を記載する。
      Research Evidenceには対象能力を明示的な調査範囲に含む`docs/report/research/**`の報告を記載する。同じ報告を複数行から参照できる。
      `LIMITED_COMPLEMENT`は、既存資産、導入済み依存、実績ある外部候補のいずれでも確認済み成果を満たせない証拠がある場合だけ使用し、その限定補完根拠を記載する。
      ファイル一覧、ディレクトリ構成、補助処理一覧、詳細な実装手順、試験階層別計画を記載しない。
      必須の第2階層の節が該当しない場合は削除せず、理由付きで「なし」と記載する。
      移行と切り戻しはリポジトリで実施・検証できる境界に限定し、外部環境操作を完了条件にしない。
    requires:
      - request
      - proposal
      - specs

  - id: tasks
    generates: tasks.md
    description: 実装成果をまとめた粗い作業パッケージ台帳
    template: tasks.md
    instruction: |
      `openspec/planner`が設計完成後にtasks.mdの作業範囲を作成・更新する。計画全体が完成したら、プライマリエージェントが`openspec/architect`へ読み取り専用の`READINESS_REVIEW`を委任する。
      tasks.md は `- [ ] WP<number>: <成果>` 形式の作業パッケージ台帳とする。
      各作業パッケージに対象の設計判断または存在するScenarioと、客観的な Completion Evidence を記載する。
      ファイル単位、補助処理単位、試験階層単位へ分解しない。
      リリース、デプロイ、外部環境操作、認証情報、外部承認を完了条件に含めない。
    requires:
      - request
      - proposal
      - specs
      - design

apply:
  requires:
    - request
    - tasks
  tracks: tasks.md
  instruction: |
    プライマリエージェントまたは利用者が選択した`openspec/applier`が、重要な判断を解決し、成果物とUX証拠が整合した計画を実装する。開始には計画完成後の`openspec/architect`の`READINESS_REVIEW`による`APPROVED`が必要で、CLI上の成果物完成や計画担当者の自己点検だけでは承認にならない。`openspec-review`の意味検査を自己点検と最終確認で共有する。承認は確認した計画に対して有効とし、重要な修正後は影響する成果物を再確認する。既存のレビュー結果を証跡とし、承認専用の永続ファイルは追加しない。
    所有者確認済みの要求、提案、存在する差分仕様、承認済み設計、作業パッケージを読み、要求が求める成果へ因果的につながる作業だけを実装、検証する。実装時の計画ファイル編集はtasks.mdの進捗に限定する。実装後の`openspec/architect`による`IMPLEMENTATION_REVIEW`は、指定された設計上の問いがある場合だけ読み取り専用で行う。
    `SHAPE`では要求の`UIモック参照`、提案の`Design Source`が示す対象アプリと承認範囲、実際の`mockups/<app>/src/**`と対象のStorybook表示例の画面・状態を照合し、要求との双方向の整合性を確認する。共有UIや観点の更新時は影響するアプリ、要求、変更を再確認する。`CONTINUITY`では既存製品の証拠を読み、`NONE`ではモックを必要としない。
    UIは`PRODUCTION_UI -> WIRING -> POLISH -> REVIEW`の順で進める。デザイナーが承認済みReactプロトタイプを対象の`apps/<app>`と`packages/ui`へ忠実に正式実装し、エンジニアは接続だけを担当する。デザイナーが確認済み契約から導ける必要な製品状態を補完し、独立レビューで忠実性と実ブラウザのデスクトップ・モバイル操作を確認する。製品コードは正式実装したUIを参照し、`mockups/`をインポートしない。プロトタイプの編集はOpenCodeが担当する。
    計画入力の不足、`SHAPE`の承認済みモックを読めない状態、要求と成果物の重要な矛盾、未解決の重要判断がある場合は、`PLANNING_REQUIRED`を返してプライマリエージェントへ戻す。要求の意味は所有者との対話へ、提案・仕様・作業範囲の不備は`openspec/planner`へ、設計の不備は`openspec/architect`へ振り分ける。実装側では計画成果物の修復や要求の再解釈を行わない。
    全作業パッケージ完了時は `node scripts/openspec/verify-scenario-coverage.mjs --change <change-id>` を実行し、選択Changeの仕様構造とPlaywright E2E試験からScenarioへの参照を検証する。
