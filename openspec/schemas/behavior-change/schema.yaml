name: behavior-change
version: 5
description: 所有者確認済みの要求から、観測可能な振る舞いの変更を提案、仕様、作業パッケージの順で管理する

artifacts:
  - id: request
    generates: request.md
    description: OpenDesignが所有者確認済みの内容を随時反映する要求
    template: request.md
    instruction: |
      OpenDesignが、リポジトリ内のOpenSpec公式スキルによる新規作成、継続、更新、検証を通じて製品の方向付けと計画を担う。
      OpenDesignは同じリポジトリの製品概要`PRODUCT.md`、ルートの単一プロトタイプ`mockups/`、計画成果物を所有する。正となるReact TypeScriptソースは`mockups/src/**`で、`App.tsx`と`main.tsx`を中心に構成する。`@cfreact-template/ui`の公開サブパスから共通実装を直接使い、仮データとローカル状態で動作させる。製品要件の根拠は確認済み要求に置く。
      OpenDesignはソースと所有者確認済みの要求を一緒に更新し、エージェントがNode.jsとリポジトリの依存関係を使って`pnpm build:mockup`を実行する。Viteは既存の共通UIのTailwind CSS 4とReact Compiler設定で単一のIIFE `mockups/dist/prototype.js`と`mockups/dist/prototype.css`を生成する。`dist`はGit管理し、ソース変更時に再生成して手編集しない。
      安定した`mockups/index.html`は`./dist/prototype.js`と`./dist/prototype.css`を相対参照し、組み込みの`Prototype Preview`で通常の静的成果物として開く。画面と状態はクエリとハッシュで選び、複数の画面・状態と複数の変更は多対多で対応する。`mockups/`は変更ディレクトリとそのアーカイブの外に維持する。編集と表示の規則は`mockups/AGENTS.md`に従う。
      `request.md`は確認済み内容を随時更新する要求の集合とし、保存する各項目が所有者確認済みであることを守る。
      具体的な解決手段より先に、利用者、現在の状況、変更動機、期待価値、希望成果を確認する。成果や範囲を左右する未確認事項だけを質問する。
      変更動機には、困りごとや制約などの否定的な要因だけでなく、期待、機会、好奇心、未探索の可能性などの肯定的な要因も含める。
      所有者が確認した背景、変更動機と期待価値、要求、明示した成果制約、明示的に必須とした手段だけを記載する。
      背景と変更動機は要求の理由を示す証拠として扱い、製品要件と成果制約は所有者が求めた成果から導く。
      解決手段を示す入力では、その手段が必要となる背景、変更動機、希望成果を先に確認し、所有者が明示的に拘束した場合だけ必須手段として記載する。
      成果制約または必須手段がない場合は、対応する任意の節を作成しない。
      関連する観点がある場合は任意の`## UI Mock References`に`mockups/index.html?scenario=default#/`や`mockups/index.html?scenario=users-error#/users`のような画面・状態の参照を記載する。`SHAPE`では対象となる実際の観点参照を必須とする。参照は設計の証拠として扱い、目的や成果は所有者が確認した要求本文に記載する。
      `Request-Status: CONFIRMED`を使用し、`Owner Confirmation`に保存した内容と所有者の明示発言との対応を記録する。
      所有者の明確な明示発言は、初回作成でも更新でも確認証拠として十分である。その内容を即時反映し、同じ内容の再承認を求めない。
      発言の意味または拘束力が不明な場合だけ、OpenDesignが一つの焦点に絞って確認してから保存する。
      `SHAPE`では要求と承認済みモックを双方向に照合し、モックが確認済み成果と制約を満たすこと、およびモックに含まれる製品の意味が要求に根拠を持つことを確認する。
      重要なUX判断の理由または所有者確認が不足する場合は対話で補い、確認済みの目的、成果、成果制約は要求へ、設計の詳細は設計成果物へ反映する。
      観点を変更したら参照する各変更の要求と判断理由を追跡し、影響する計画成果物を整合させる。利用者の体験に影響する要求を更新した場合も、関連する観点を見直す。
    requires: []

  - id: proposal
    generates: proposal.md
    description: 所有者確認済みの要求を実現する変更提案
    template: proposal.md
    instruction: |
      `Request-Status: CONFIRMED`のrequest.mdを読み、記載された要求の範囲だけを提案する。
      request.mdが存在しない、確認済みでない、または意味が不明な場合は成果物を作成せず、OpenDesignが所有者へ確認する。
      関連するリポジトリの事実を確認する。成果物の意味に関わる内容が確認済み要求または権威ある証拠から自明でない場合は、OpenDesignが所有者へ一つの焦点に絞って確認する。
      新規外部パッケージの採用、既存依存の更新・置換、複数パッケージへ影響する再利用境界、独自実装の代替不能判断が必要な場合は、重要な依存判断をdesign.mdなしで確定せず`ARCHITECTURE`へ分類し直す。
      リポジトリの事実、一般的な慣行、セキュリティ上の推奨、実装上の必要性から新しい成果または成果制約を追加しない。
      所有者が明示した必須手段は設計または作業の制約として扱う。
      `UX-Mode` は `NONE`、`CONTINUITY`、`SHAPE` のいずれかとする。
      `NONE`ではモックを必要としない。`CONTINUITY`では維持する既存の製品体験を特定し、参照して内容を確認できる実装済み製品の証拠を`Continuity Source`に記録する。
      `SHAPE`のproposal.mdは、所有者が対象の方向性を採用し、確認済み成果と承認済みモックの重要な内容が双方向に整合してから作成する。
      `SHAPE`では`UI / UX Impact`内に、中心作業を`Primary User Task`、採用した体験の方向性と重要な判断の理由を`UX Direction`、承認済みモックの参照を`Design Source`として記録する。
      `Design Source`には、要求の`UI Mock References`と同じ形式の採用済み画面・状態の正確な参照、関連する画面・操作の流れ・状態の範囲、その範囲を所有者が採用した短い証跡を記載する。承認の証拠はこの既存の節で扱い、設計の詳細は`mockups/src/**`と参照先の静的成果物で確認する。
      重要なUX判断の理由または所有者確認が不足する場合はOpenDesignが所有者へ確認し、内容の意味に応じて要求または設計へ反映してから提案を作成する。
      Thesaurus は業務用語の統一が必要な場合だけ追加する。
      `Confirmed Change Boundary`は実現する肯定的な成果と外部契約の境界だけを記載する。
      実装手順、ファイル一覧、試験階層別計画は記載しない。
    requires:
      - request

  - id: specs
    generates: 'specs/*/spec.md'
    description: Spec Unit ごとの観測可能な差分仕様
    template: spec.md
    instruction: |
      request.md、proposal.md、該当する承認済み設計を読み、確認済み要求から直接導ける各仕様領域に `specs/<capability>/spec.md` を作成する。`SHAPE`では`Design Source`の承認済みモックを確認する。
      製品の意味を認める根拠はrequest.mdだけとし、承認済み設計は要求を実現する具体像として照合する。重要な不整合はOpenDesignが所有者との対話で解決してから仕様を作成する。
      冒頭の `## Purpose` に、所有者確認済みの要求が求める永続的仕様領域の目的を肯定形で記載する。
      差分見出しは `## ADDED Requirements`、`## MODIFIED Requirements`、`## REMOVED Requirements`、`## RENAMED Requirements` だけを使用する。
      要件とシナリオには、所有者が確認した利用者または外部契約から観測できる肯定的な終端状態だけを記載する。
      必須手段と設計の詳細は設計成果物で扱う。所有者が求める体験そのものを表す可視のUI構成または配置は、要求で確認済みの成果制約として記載できる。
      削除する既存要件は`REMOVED Requirements`で除去する。
      認可や秘密非開示など拒否自体が確認済み成果に含まれる場合も、認可された主体や公開可能な情報を表す肯定的な保証として定義し、その保証を観測する拒否シナリオを記載できる。
      シナリオ見出しは `#### Scenario: <名称> (<CAPABILITY>-S###)` とし、安定した識別子を付ける。
    requires:
      - request
      - proposal

  - id: tasks
    generates: tasks.md
    description: 実装成果をまとめた粗い作業パッケージ台帳
    template: tasks.md
    instruction: |
      tasks.md は `- [ ] WP<number>: <成果>` 形式の作業パッケージ台帳とする。
      各作業パッケージに対象の Requirement または Scenario と、客観的な Completion Evidence を記載する。
      ファイル単位、補助処理単位、試験階層単位へ分解しない。
      リリース、デプロイ、外部環境操作、認証情報、外部承認を完了条件に含めない。
    requires:
      - request
      - proposal
      - specs

apply:
  requires:
    - request
    - tasks
  tracks: tasks.md
  instruction: |
    OpenDesignから、計画上の重要な判断が解決済みの成果物を受け取る。所有者確認済みの要求、提案、差分仕様、該当する承認済み設計、作業パッケージを読み、要求が求める成果へ因果的につながる作業だけを実装、検証する。
    `SHAPE`では要求の`UI Mock References`、提案の`Design Source`が示す承認範囲、実際の`mockups/src/**`と対象の静的成果物の画面・状態を照合し、要求との双方向の整合性を確認する。共有観点の更新時は影響する各変更を再確認する。`CONTINUITY`では既存製品の証拠を読み、`NONE`ではモックを必要としない。
    UIは`PRODUCTION_UI -> WIRING -> POLISH -> REVIEW`の順で進める。デザイナーが承認済みReactプロトタイプをアプリUIと`packages/ui`へ正式実装し、エンジニアは接続だけを担当する。デザイナーが確認済み契約から導ける必要な製品状態を補完し、独立レビューで忠実性と実ブラウザのデスクトップ・モバイル操作を確認する。製品コードは正式実装したUIを参照し、`mockups/`をインポートしない。プロトタイプの編集はOpenDesignが担当する。
    計画入力の不足、`SHAPE`の承認済みモックを読めない状態、要求と成果物の重要な矛盾、未解決の重要判断がある場合は、`OPENDESIGN_PLANNING_REQUIRED`を返してOpenDesignへ戻す。実装側では計画成果物の修復や要求の再解釈を行わない。
    全作業パッケージ完了時は `node scripts/openspec/verify-scenario-coverage.mjs --change <change-id>` を実行し、選択Changeの仕様構造とPlaywright E2E試験からScenarioへの参照を検証する。
